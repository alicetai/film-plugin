<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Film Camera</title>
  <style>
    :root {
      --accent: #000000;
      --text: #1b1b1b;
      --text-tertiary: #756f62;
      --surface: #f1ebd8;
      --surface-subtle: #ebe4d0;
      --border: #d8cfb8;
      --accent-tint: #ebe4d0;
      --success-bg: #ecfdf3;
      --success: #027a48;
      --error-bg: #fef3f2;
      --error: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden;
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text); background: var(--surface); font-size: 13px; line-height: 1.45;
    }
    main { padding: 24px 20px 20px; }
    .identity { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
    .mark {
      width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center;
      color: white; border-radius: 8px; background: var(--accent);
      box-shadow: 0 4px 10px rgba(0, 0, 0, .14);
    }
    h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.15px; }
    .eyebrow { margin: 2px 0 0; color: var(--text); font-size: 12px; }
    .intro { color: var(--text); margin: 0 0 18px; font-size: 13px; line-height: 1.55; }
    .preset {
      border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-tint);
      padding: 12px; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px;
    }
    .swatch { width: 28px; height: 28px; border-radius: 6px; flex: 0 0 auto; overflow: hidden; position: relative;
      background: linear-gradient(135deg, #f6dd8d 0%, #c57632 46%, #4f663d 47%, #14241e 100%); }
    .swatch:after { content: ""; position:absolute; inset:0; opacity:.28; background-image: radial-gradient(#fff 0.7px, transparent .8px); background-size:4px 4px; }
    .preset strong { display: block; color: var(--text); font-size: 13px; font-weight: 700; }
    .preset p { margin: 2px 0 0; color: var(--text); font-size: 12px; line-height: 1.45; }
    .selection {
      min-height: 57px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px; transition: border-color .15s, background .15s;
    }
    .selection.ready { border-color: var(--accent); background: var(--accent-tint); }
    .selection-icon { width: 18px; height: 18px; color: var(--text-tertiary); flex: 0 0 auto; }
    .selection.ready .selection-icon { color: var(--accent); }
    .selection-copy { min-width: 0; }
    .selection-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: 12px; font-weight: 700; }
    .selection-detail { display: block; color: var(--text); font-size: 11px; margin-top: 1px; }
    .notice { display: none; border-radius: 8px; padding: 10px; margin: -4px 0 12px; font-size: 12px; line-height: 1.45; }
    .notice.show { display: flex; gap: 7px; align-items: flex-start; }
    .notice.error { background: var(--error-bg); border: 1px solid #fecdca; color: var(--error); }
    .notice.success { background: var(--success-bg); border: 1px solid #a6f4c5; color: var(--success); }
    button {
      width: 100%; min-height: 44px; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--accent); color: #fff; font: 700 13px inherit;
      display: flex; gap: 8px; align-items: center; justify-content: center;
      transition: background .15s, transform .1s, opacity .15s;
    }
    button:hover:not(:disabled) { background: #242424; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .loader { display: none; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color: white; border-radius: 50%; animation: spin .75s linear infinite; }
    button.loading .loader { display: block; }
    button.loading .button-label { animation: shimmer 1.6s linear infinite; }
    .footnote { margin: 12px 0 0; text-align: center; color: var(--text-tertiary); font-size: 11px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { 50% { opacity: .65; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header class="identity">
      <div><h1>Film Camera</h1></div>
    </header>
    <p class="intro">Give any image a film look.</p>
    <section class="preset" aria-label="Selected film preset">
      <div class="swatch" aria-hidden="true"></div>
      <div><strong>Film reference</strong><p>Calibrated colour, gentle scan softness and fine 35mm grain.</p></div>
    </section>
    <section id="selection" class="selection" aria-live="polite">
      <svg class="selection-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.2"/><path d="m21 15-4.5-4.5L7 20"/></svg>
      <div class="selection-copy"><span id="selection-title" class="selection-title">No image selected</span><span id="selection-detail" class="selection-detail">Select an image layer on the canvas to get started.</span></div>
    </section>
    <div id="notice" class="notice" role="status"></div>
    <button id="apply" disabled type="button"><span class="loader" aria-hidden="true"></span><span class="button-label">Apply film effect</span></button>
  </main>

    applyButton.addEventListener('click', function() {
      if (!hasImage) return;
      setNotice('', ''); setLoading(true, 'Preparing image…');
      parent.postMessage({ pluginMessage: { type: 'request-image' } }, '*');
    });

    window.onmessage = async function(event) {
      var message = event.data.pluginMessage;
      if (!message) return;
      if (message.type === 'selection') {
        hasImage = message.selection.valid;
        titleEl.textContent = message.selection.title;
        detailEl.textContent = message.selection.detail;
        selectionEl.classList.toggle('ready', hasImage);
        setNotice('', ''); setLoading(false);
      }
      if (message.type === 'source-image') {
        try {
          processingTargetId = message.targetId;
          processingSeed = message.seed || message.targetId;
          setLoading(true, 'Developing film…');
          var output = await processFilm(message.bytes, processingSeed);
          setLoading(true, 'Applying effect…');
          parent.postMessage({ pluginMessage: { type: 'apply-image', bytes: output, targetId: processingTargetId } }, '*');
        } catch (error) {
          setLoading(false); setNotice(error.message || 'Could not process this image.', 'error');
        }

      if (message.type === 'complete') {
        processingTargetId = null;
        setLoading(false); setNotice(message.message, 'success');
      }
      if (message.type === 'error') {
        processingTargetId = null;
        setLoading(false); setNotice(message.message, 'error');
      }
    };
